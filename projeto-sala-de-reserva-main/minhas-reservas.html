<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Reservas - Sala 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div>
          <div class="brand" style="flex-direction: column; align-items: flex-start; gap: 4px;">
          <img src="assets/img/logo.png" alt="Logo Sala 360" class="custom-logo">
          <p class="eyebrow" style="margin: 0; padding-left: 4px;">Espaço Coworking Gov.br</p>
        </div>
        <nav class="menu">
          <a class="menu-link" href="dashboard.html">Dashboard</a>
          <a class="menu-link" href="agenda.html">Agenda</a>
          <a class="menu-link" href="nova-reserva.html">Nova reserva</a>
          <a class="menu-link active" href="minhas-reservas.html">Minhas reservas</a>
          <a class="menu-link admin-only hidden" href="admin.html">Painel admin</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <button class="ghost-btn" id="themeToggle" type="button">🌙 Tema</button>
        <button class="danger-btn" id="logoutBtn" type="button">Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <span class="eyebrow">Histórico do usuário</span>
          <h2>Minhas reservas</h2>
        </div>
        <div class="user-chip" id="userChip"></div>
      </header>

      <article class="card">
        <div class="section-head"><h3>Reservas cadastradas</h3></div>
        <div id="myReservations" class="list-stack"></div>
      </article>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal hidden" id="confirmModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Confirmar ação</h3>
      <p id="modalText">Deseja realmente cancelar esta reserva?</p>
      <div class="modal-actions">
        <button class="secondary-btn" id="cancelModalBtn">Voltar</button>
        <button class="danger-btn" id="confirmModalBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/minhas-reservas.js"></script>
</body>
</html>
