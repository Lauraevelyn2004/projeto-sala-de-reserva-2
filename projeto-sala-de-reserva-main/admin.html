<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Sala 360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div>
        <div class="brand" style="flex-direction: column; align-items: flex-start; gap: 4px;">
          <img src="assets/img/logo.png" alt="Logo Sala 360" class="custom-logo">
          <p class="eyebrow" style="margin: 0; padding-left: 4px;">Espaço Coworking Gov.br</p>
        </div>
        <nav class="menu">
          <a class="menu-link" href="dashboard.html">Dashboard</a>
          <a class="menu-link" href="agenda.html">Agenda</a>
          <a class="menu-link" href="nova-reserva.html">Nova reserva</a>
          <a class="menu-link" href="minhas-reservas.html">Minhas reservas</a>
          <a class="menu-link active admin-only" href="admin.html">Painel admin</a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <button class="danger-btn full" id="logoutBtn" type="button" style="width: 100%;">Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <span class="eyebrow">Área administrativa</span>
          <h2>Painel administrativo</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="ghost-btn" id="themeToggle" type="button">🌙 Tema</button>
          <div class="user-chip" id="userChip"></div>
        </div>
      </header>

      <section class="grid two">
        <article class="card">
          <div class="section-head"><h3>Todas as reservas</h3></div>
          <div id="allReservations" class="list-stack"></div>
        </article>

        <article class="card form-card">
          <h3>Cadastrar responsável</h3>
          <form id="responsavelForm">
            <div class="field">
              <label for="responsavelName">Nome completo</label>
              <input type="text" id="responsavelName" required>
            </div>
            <div class="field">
              <label for="responsavelEmail">E-mail</label>
              <input type="email" id="responsavelEmail" required>
            </div>
            <div class="field">
              <label for="responsavelPassword">Senha</label>
              <input type="password" id="responsavelPassword" required>
            </div>
            <button type="submit" class="primary-btn full">Cadastrar responsável</button>
          </form>
        </article>

        <article class="card">
          <div class="section-head"><h3>Responsáveis cadastrados</h3></div>
          <div id="adminUsers" class="list-stack"></div>
        </article>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal hidden" id="adminCancelModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="section-head simple">
        <h3>Cancelar Reserva</h3>
        <p class="eyebrow">Esta ação enviará uma notificação ao usuário.</p>
      </div>
      
      <form id="adminCancelForm">
        <div class="field">
          <label for="cancelReason">Motivo do cancelamento</label>
          <textarea id="cancelReason" rows="3" required placeholder="Ex: Manutenção na rede elétrica programada para o período."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="secondary-btn" id="closeAdminCancelModal">Voltar</button>
          <button type="submit" class="danger-btn">Confirmar Cancelamento</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
